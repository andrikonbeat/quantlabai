# JForex Bridge Configuration
server.port: "${JFOREX_BRIDGE_PORT:8082}"
server.address: 0.0.0.0

# Allow circular references (MarketDataService <-> MarketDataWebSocketController)
spring.main.allow-circular-references: true

# JForex Connection
jforex.jnlp-url: "${JFOREX_JNLP_URL:https://www.dukascopy.com/client/jforex/jnlp/jforex.jnlp}"
jforex.username: "${JFOREX_USERNAME:}"
jforex.password: "${JFOREX_PASSWORD:}"
jforex.demo: "${JFOREX_DEMO:true}"

# Connection pool
jforex.connection.max-retries: 5
jforex.connection.retry-delay-ms: 5000
jforex.connection.timeout-ms: 30000

# WebSocket
spring.websocket.allowed-origins: "*"

# Logging
logging.level.com.quantlab.jforex_bridge: DEBUG
logging.level.com.dukascopy: INFO
logging.level.org.springframework.web.socket: DEBUG

# Actuator
management.endpoints.web.exposure.include: health,info,shutdown
management.endpoint.shutdown.enabled: true
management.endpoint.health.show-details: always

# Server
server.shutdown: graceful
spring.lifecycle.timeout-per-shutdown-phase: 30s