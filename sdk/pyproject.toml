[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab"
version = "0.1.0"
description = "QuantLab AI — Quantitative research SDK for algorithmic trading"
requires-python = ">=3.11"
authors = [
    { name = "QuantLab AI" },
]
dependencies = [
    "pydantic>=2.0,<3",
    "pyyaml>=6.0",
    "platformdirs>=4.0",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "mcp>=1.0.0,<2",
    "yfinance>=0.2.0",
    "pandas-datareader>=0.10.0",
    "openai>=1.0",
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "duckduckgo-search>=7.0",
    "ta>=0.11",
    "jinja2>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Required by the root pytest.ini: `asyncio_mode = auto` is a pytest-asyncio
    # option, and the suite has async tests in both tests/ and sdk/tests/.
    # Without the plugin, pytest >= 8.4 fails unhandled coroutines instead of
    # running them, so this is a hard requirement, not a convenience.
    "pytest-asyncio>=1.0",
    # Required by the `lint` job in .github/workflows/ci.yml, which runs
    # `ruff check .`, `ruff format --check .` and `mypy quantlab --strict`
    # from ./sdk. Without these the job died at exit 127 (command not found)
    # and, because `test` declares `needs: lint`, the whole test job was
    # skipped. Declared here so the gate can actually report a verdict;
    # the violations it now surfaces are tracked as a separate work unit.
    # Not pinned on purpose: pinning is part of that work unit, because an
    # unpinned linter can turn the gate red on an unrelated commit.
    "ruff>=0.6",
    "mypy>=1.10",
]
reporting = [
    "plotly>=5.18",
]
reporting-matplotlib = [
    "matplotlib>=3.5",
]
dashboard = [
    "flask>=3.0",
]

[project.scripts]
quantlab = "quantlab.cli.main:cli_entry"

[tool.setuptools.packages.find]
include = ["quantlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
