[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab"
version = "0.1.0"
description = "QuantLab AI — Quantitative research SDK for algorithmic trading"
requires-python = ">=3.11"
authors = [
    { name = "QuantLab AI" },
]
dependencies = [
    "pydantic>=2.0,<3",
    "pyyaml>=6.0",
    "platformdirs>=4.0",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "mcp>=1.0.0,<2",
    "yfinance>=0.2.0",
    "pandas-datareader>=0.10.0",
    "openai>=1.0",
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "duckduckgo-search>=7.0",
    "ta>=0.11",
    "jinja2>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
reporting = [
    "plotly>=5.18",
]
reporting-matplotlib = [
    "matplotlib>=3.5",
]
dashboard = [
    "flask>=3.0",
]

[project.scripts]
quantlab = "quantlab.cli.main:cli_entry"

[tool.setuptools.packages.find]
include = ["quantlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
