[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab"
version = "0.1.0"
description = "QuantLab AI — Quantitative research SDK for algorithmic trading"
requires-python = ">=3.11"
authors = [
    { name = "QuantLab AI" },
]
dependencies = [
    "pydantic>=2.0,<3",
    "pyyaml>=6.0",
    "platformdirs>=4.0",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "mcp>=1.0.0,<2",
    "yfinance>=0.2.0",
    "pandas-datareader>=0.10.0",
    "openai>=1.0",
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "duckduckgo-search>=7.0",
    "ta>=0.11",
    "jinja2>=3.0",
    # Needed by production code paths, not only by tests:
    # sqx/campaign_monitor.py:908 and sqx/llm_generation_monitor.py:353 do a
    # function-local `from rich.prompt import Confirm` on the CLI-mode branch
    # (no _gate_writer, no _on_watcher_event). The import is deferred, but there
    # is no fallback, so a CLI campaign that hits a WARNING/CRITICAL watcher
    # event died with ModuleNotFoundError instead of prompting. Base dependency
    # because any user running the documented CLI flow needs it.
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Required by the root pytest.ini: `asyncio_mode = auto` is a pytest-asyncio
    # option, and the suite has async tests in both tests/ and sdk/tests/.
    # Without the plugin, pytest >= 8.4 fails unhandled coroutines instead of
    # running them, so this is a hard requirement, not a convenience.
    "pytest-asyncio>=1.0",
    # Required by the `lint` job in .github/workflows/ci.yml, which runs
    # `ruff check .`, `ruff format --check .` and `mypy quantlab --strict`
    # from ./sdk. Without these the job died at exit 127 (command not found)
    # and, because `test` declares `needs: lint`, the whole test job was
    # skipped. Declared here so the gate can actually report a verdict.
    #
    # Pinned EXACTLY (==), not with ~=. These tools define the debt baseline,
    # so a floating constraint made the number move with no code change at
    # all: going ruff 0.16.9 -> 0.16.10 added 92 violations on an untouched
    # tree. There is also no [tool.ruff] section anywhere, so the enabled
    # rule set is simply whatever these versions ship as defaults — which is
    # precisely why the version must stop floating.
    #
    # Measured baseline for these exact versions (sdk/, 283 source files):
    #   ruff check .              1871 violations (1115 auto-fixable)
    #   ruff format --check .     271 files would be reformatted
    #   mypy quantlab --strict    745 errors in 134 files
    # The `lint` job carries `continue-on-error: true` while this is paid
    # down, so none of it blocks delivery yet.
    #
    # Dependabot (weekly, /sdk) opens deliberate bump PRs for both, so exact
    # pinning costs no security patches: an upgrade becomes a reviewed
    # decision instead of a surprise on an unrelated commit.
    "ruff==0.16.10",
    "mypy==2.4.0",
    # The canonical suite (AGENTS.md: testpaths = tests + sdk/tests) collects
    # tests/dashboard/ and sdk/tests/dashboard/, which import quantlab.dashboard,
    # which imports flask at module level. flask lived only in the optional
    # `dashboard` extra, so `pip install -e "sdk[dev]"` produced an environment
    # that could not run the suite it was meant to enable. The extra stays for
    # end users; dev needs it because the tests need it.
    "flask>=3.0",
    # tests/phase5/test_reporting.py::test_charts_generated_list asserts
    # 'equity_curve' in result.charts_generated, and the two smoke tests assert
    # `report generate` exits 0. reporting/generator.py guards plotly with
    # try/except and warns "HTML report generated without charts", but
    # ReportResult.is_successful() is False in that case, so the CLI returns 2
    # and the chart assertion fails. The source degrades gracefully; the tested
    # contract requires a charting backend. dev provides it so the canonical
    # suite is runnable. Note: this means CI no longer exercises the
    # no-backend degradation branch.
    "plotly>=5.18",
    # Type stubs for two runtime deps that ship none. Without these, mypy
    # --strict reports 26 "Library stubs not installed for yaml" + 7 for
    # pandas, and the only ways to silence those are a blanket
    # ignore_missing_imports (which would stop checking *every* other
    # import too) or pinning the packages to Any. Real stubs are ~1.5 MB
    # total and give genuine checking: PyYAML's API is small (18 .pyi
    # files), pandas is large (184) because DataFrame genuinely is.
    # Measured effect on the baseline: 736 -> 696 errors, no new ones.
    "types-PyYAML>=6.0",
    "pandas-stubs>=3.0",
]
reporting = [
    "plotly>=5.18",
]
reporting-matplotlib = [
    "matplotlib>=3.5",
]
dashboard = [
    "flask>=3.0",
]

[project.scripts]
quantlab = "quantlab.cli.main:cli_entry"

[tool.setuptools.packages.find]
include = ["quantlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

# mypy is invoked as `mypy quantlab --strict` from ./sdk by the lint job.
# `strict = true` here restates that in config so the result does not depend
# on which flags the caller remembered to pass.
[tool.mypy]
strict = true

# Modules with no available stubs and no mypy plugin. Listed one by one on
# purpose: a bare `ignore_missing_imports = true` under [tool.mypy] would
# disable resolution checking for *every* import in the package, which is
# strictly worse than the problem it solves. Each entry is a real dependency
# that genuinely ships no type information.
#
# `quantlab.license.manager` is the odd one out: first-party, but optional.
# builder_agent.py imports it inside a try/except ImportError and falls back to
# probing $SQX_LICENSE_PATH / ~/.sqx/license.key, so the module is expected to
# be absent at runtime. Without this override mypy reports it as a missing
# module even though the ImportError is the intended control flow.
#
# Two distinct mypy messages land here and both need the override:
#   "Cannot find implementation or library stub"      -> not installed at all
#   "installed, but missing library stubs or py.typed" -> installed, untyped
# The second group (plotly, yfinance, pandas_datareader, ta, feedparser) is easy
# to miss when grepping only for the first wording.
[[tool.mypy.overrides]]
module = [
    "aiohttp.*",
    "aiosmtplib.*",
    "feedparser",
    "matplotlib.*",
    "pandas_datareader",
    "plotly.*",
    "portalocker.*",
    "sentence_transformers.*",
    "ta.*",
    "yfinance",
    "quantlab.license.manager",
]
ignore_missing_imports = true
