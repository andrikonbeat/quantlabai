name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  release:
    types: [published]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  POETRY_VERSION: '1.8.2'

jobs:
  # ============================================================
  # Lint & Type Check
  # ============================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'poetry'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: false

      - name: Install dependencies
        working-directory: ./sdk
        run: poetry install --no-interaction --no-ansi --with dev

      - name: Run Ruff
        working-directory: ./sdk
        run: poetry run ruff check .

      - name: Run Ruff Format
        working-directory: ./sdk
        run: poetry run ruff format --check .

      - name: Run MyPy
        working-directory: ./sdk
        run: poetry run mypy quantlab --strict

  # ============================================================
  # Unit & Integration Tests
  # ============================================================
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'poetry'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: false

      - name: Install dependencies
        working-directory: ./sdk
        run: poetry install --no-interaction --no-ansi --with dev

      - name: Run Tests
        working-directory: ./sdk
        run: poetry run pytest tests/ -q --tb=short --maxfail=5 -x

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./sdk/coverage.xml
          flags: unittests
          fail_ci_if_error: false

  # ============================================================
  # Integration Tests with SQX (requires SQX installation)
  # ============================================================
  integration:
    name: Integration Tests (SQX)
    runs-on: ubuntu-latest
    needs: lint
    if: github.repository == 'quantlab/quantlab-ai' && github.event_name != 'pull_request'
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'poetry'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: false

      - name: Install dependencies
        working-directory: ./sdk
        run: poetry install --no-interaction --no-ansi --with dev

      - name: Start SQX Daemon
        run: |
          cd assets/SQX_144_2953_linux_20260601
          timeout 120 ./StrategyQuantX -gui & > sqx.log 2>&1 &
          sleep 30
          curl -f http://localhost:5050/call?cmd=help || exit 1

      - name: Run Integration Tests
        working-directory: ./sdk
        env:
          QUANTLAB_KNOWLEDGE_ROOT: ${{ github.workspace }}/knowledge
        run: |
          poetry run pytest tests/phase4/ -q --tb=short -k "not slow"

      - name: Stop SQX Daemon
        if: always()
        run: |
          pkill -f "StrategyQuantX" || true

  # ============================================================
  # Build Docker Images
  # ============================================================
  docker:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'release'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/quantlab
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Publish to PyPI
  # ============================================================
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: false

      - name: Build & Publish
        working-directory: ./sdk
        run: |
          poetry build
          poetry publish --username __token__ --password ${{ secrets.PYPI_API_TOKEN }}

  # ============================================================
  # Build Documentation
  # ============================================================
  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: false

      - name: Install docs dependencies
        working-directory: ./sdk
        run: poetry install --no-interaction --no-ansi --with docs

      - name: Build docs
        working-directory: ./sdk
        run: |
          poetry run mkdocs build --site-dir ../../docs/html --strict

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/html
          force_orphan: true