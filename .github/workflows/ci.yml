name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  release:
    types: [published]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================================
  # Lint & Type Check
  # ============================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e "sdk[dev]"

      - name: Run Ruff
        working-directory: ./sdk
        run: ruff check .

      - name: Run Ruff Format
        working-directory: ./sdk
        run: ruff format --check .

      - name: Run MyPy
        working-directory: ./sdk
        run: mypy quantlab --strict

  # ============================================================
  # Unit & Integration Tests
  # ============================================================
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e "sdk[dev]"

      - name: Run Tests
        working-directory: ./sdk
        run: pytest -q --tb=short --maxfail=5 --cov=quantlab --cov-report=xml:coverage.xml

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./sdk/coverage.xml
          flags: unittests
          fail_ci_if_error: false

  # ============================================================
  # Integration Tests with SQX (requires SQX installation)
  # ============================================================
  integration:
    name: Integration Tests (SQX)
    runs-on: ubuntu-latest
    needs: lint
    if: github.repository == 'quantlab/quantlab-ai' && github.event_name != 'pull_request'
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e "sdk[dev]"

      - name: Start SQX Daemon
        run: |
          cd assets/SQX_144_2953_linux_20260601
          timeout 120 ./StrategyQuantX -gui & > sqx.log 2>&1 &
          sleep 30
          curl -f http://localhost:5050/call?cmd=help || exit 1

      - name: Run Integration Tests
        working-directory: ./sdk
        env:
          QUANTLAB_KNOWLEDGE_ROOT: ${{ github.workspace }}/knowledge
        run: |
          pytest tests/phase4/ -q --tb=short -k "not slow"

      - name: Stop SQX Daemon
        if: always()
        run: |
          pkill -f "StrategyQuantX" || true

  # ============================================================
  # Build Docker Images
  # ============================================================
  docker:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'release'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/quantlab
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Publish to PyPI
  # ============================================================
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build
        working-directory: ./sdk
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/dist
