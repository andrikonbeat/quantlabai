name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  release:
    types: [published]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================================
  # Lint & Type Check
  # ============================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    # Non-blocking while the lint/type debt is paid down. Measured against
    # ruff 0.16.9 defaults with no [tool.ruff] config in the repo: 1779
    # violations (1025 auto-fixable) across sdk/, plus 271 files failing
    # `ruff format --check`. The dominant rules are UP045, F401, BLE001,
    # I001, RUF012 and UP006 — mostly mechanical.
    #
    # This was previously NOT a debt gate but a dead one: the job invoked
    # `ruff` and `mypy` while the install step only provided
    # `pip install -e "sdk[dev]"`, and neither tool was declared there. Every
    # run failed at "Run Ruff" with exit 127 (command not found), and because
    # `test` declares `needs: lint`, the entire test job was skipped. The
    # pipeline could not report green, and did not run the root suite at all.
    #
    # TODO: drop continue-on-error once the debt is paid, and pin ruff/mypy.
    # They are unpinned, so a new ruff release can turn this job red on an
    # unrelated commit.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e "sdk[dev]"

      - name: Run Ruff
        working-directory: ./sdk
        run: ruff check .

      - name: Run Ruff Format
        working-directory: ./sdk
        run: ruff format --check .

      - name: Run MyPy
        working-directory: ./sdk
        run: mypy quantlab --strict

  # ============================================================
  # Unit & Integration Tests
  # ============================================================
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e "sdk[dev]"

      - name: Run Flow Integrity Contract
        # Runs first and standalone, with no --maxfail, so the REQ-37 14-phase
        # invariant and the prompt/skill sync contracts can never be skipped by
        # an early abort in the full suite below.
        env:
          SQX_FORCE_MOCK: '1'
        run: pytest -q --tb=short tests/campaign/

      - name: Run Tests
        # Canonical root suite (AGENTS.md): testpaths = tests + sdk/tests.
        # Running from ./sdk would collect only sdk/tests/ via
        # sdk/pyproject.toml testpaths and silently skip the whole root
        # tests/ tree. SQX_FORCE_MOCK=1 is mandatory: it keeps the suite off
        # the real SQX daemon on port 5050, which does not exist in CI.
        env:
          SQX_FORCE_MOCK: '1'
        run: pytest -q --tb=short --cov=quantlab --cov-report=xml:coverage.xml

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  # ============================================================
  # Integration Tests with SQX (requires SQX installation)
  # ============================================================
  # DO NOT ACTIVATE WITHOUT AN OWNER DECISION. This job is dead for two
  # independent reasons, and fixing only the first turns a silent no-op into
  # a hard CI failure:
  #
  #   1. The `if:` guard below compares github.repository against
  #      'quantlab/quantlab-ai', but the remote is andrikonbeat/quantlabai.
  #      The condition can never be true, so this job has never run.
  #   2. The "Start SQX Daemon" step does `cd assets/SQX_144_2953_linux_20260601`,
  #      and that path is a git-ignored symlink to a machine-local SQX install
  # (.gitignore ignores assets/SQX_*; no symlink is tracked). On a fresh
  #      CI checkout the path does not exist at all.
  #
  # So the guard is left untouched on purpose: correcting reason 1 alone would
  # immediately fail reason 2. Provisioning the SQX install in CI is a
  # separate piece of work and is out of scope for this change.
  integration:
    name: Integration Tests (SQX)
    runs-on: ubuntu-latest
    needs: lint
    if: github.repository == 'quantlab/quantlab-ai' && github.event_name != 'pull_request'
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e "sdk[dev]"

      - name: Start SQX Daemon
        run: |
          cd assets/SQX_144_2953_linux_20260601
          timeout 120 ./StrategyQuantX -gui & > sqx.log 2>&1 &
          sleep 30
          curl -f http://localhost:5050/call?cmd=help || exit 1

      - name: Run Integration Tests
        working-directory: ./sdk
        env:
          QUANTLAB_KNOWLEDGE_ROOT: ${{ github.workspace }}/knowledge
        run: |
          pytest tests/phase4/ -q --tb=short -k "not slow"

      - name: Stop SQX Daemon
        if: always()
        run: |
          pkill -f "StrategyQuantX" || true

  # ============================================================
  # Build Docker Images
  # ============================================================
  docker:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'release'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/quantlab
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Publish to PyPI
  # ============================================================
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build
        working-directory: ./sdk
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/dist
