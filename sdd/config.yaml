# sdd/config.yaml
schema: spec-driven

context: |
  Tech stack: Python 3.11+ SDK (pydantic, pandas, numpy, httpx, MCP, OpenAI),
    Go 1.23 installer (Bubbletea TUI), Kotlin app_movil. Tools: StrategyQuant X
    (SQX) via sqcli CLI and .cfx config files, JForex 4 platform, Dukascopy-only
    market data, JCloud deployment.
  Architecture: AI-directed research engine — OpenCode as research director,
    SQX as computation engine. 14-phase campaign lifecycle with fail-closed
    human gates. SDD change backlog empty (53 archived, 0 active); normative
    capability specs under sdd/specs/ (107). Canonical state: sdd/PROJECT_STATE.md.
  Workflow: ODD (Organic Driven Development) for execution; SDD specs as contracts.
  Testing: pytest, strict_tdd: true. Run the suite with
    `SQX_FORCE_MOCK=1 python3 -m pytest -q` (the env var keeps the real SQX
    daemon off port 5050).
  Style: Quant research workflow, component-based strategy library.

rules:
  proposal:
    - Include rollback plan for risky changes
    - Link to relevant SQX CLI commands or .cfx structures when applicable
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Specify market conditions, timeframes, and acceptance criteria explicitly
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Include SQX integration points and .cfx XML structure references
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Separate SQX research tasks from SDK/code tasks
  apply:
    rules:
      - Follow existing code patterns
    tdd: true
    test_command: "SQX_FORCE_MOCK=1 python3 -m pytest -q"
  verify:
    test_command: "SQX_FORCE_MOCK=1 python3 -m pytest -q"
    build_command: ""  # no build step in this project
    coverage_threshold: 0  # coverage off (testing.coverage: false)
  archive:
    - Warn before merging destructive deltas

agents:
  quantlab-orchestrator:
    routing:
      sdd: gentle-orchestrator
      cli: sqcli
      dashboard: phase2-queue
      campaign: quantlab-campaign
      knowledge: codegraph-read
    permission:
      question: allow
      destructive_patterns:
        - rm
        - rm -rf
        - git push --force
      sensitive_file_patterns:
        - "**/.env*"
        - "**/*.pem"
        - "**/.ssh/**"
      auto_approve:
        - read
        - edit
        - write
        - task
        - sdk/pipeline/*
    sqcli:
      path: assets/SQX_144_2953_linux_20260601/sqcli
      env_fallback: SQCLI_PATH
      timeout_seconds: 300
      result_format:
        - exit_code
        - stdout
        - stderr
        - duration_ms

testing:
  strict_tdd: true
  runner: pytest
  unit: false
  integration: false
  e2e: false
  coverage: false
  linter: none
  type_checker: none
  formatter: none
