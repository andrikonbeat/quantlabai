[pytest]
testpaths =
    tests
    sdk/tests
norecursedirs =
    assets
    sdk/.venv
    .venv
    venv
    .git
    build
    dist
    __pycache__
    *.egg-info
filterwarnings =
    # Python 3.14 argparse reports unawaited coroutine mocks from async CLI
    # registration — harmless, internal to argparse's test-time mock setup.
    ignore::RuntimeWarning:argparse
asyncio_mode = auto

# Default to HTTP API for tests (feature flag)
addopts = -p no:cacheprovider
env =
    SQX_FORCE_MOCK = 1
    QUANTLAB_SQX_USE_HTTP = 1
    QUANTLAB_JFOREX_BRIDGE = 1
