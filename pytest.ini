[pytest]
testpaths =
    tests
    sdk/tests
norecursedirs =
    assets
    sdk/.venv
    .venv
    venv
    .git
    build
    dist
    __pycache__
    *.egg-info
filterwarnings =
    # Python 3.14 argparse reports unawaited coroutine mocks from async CLI
    # registration — harmless, internal to argparse's test-time mock setup.
    ignore::RuntimeWarning:argparse
asyncio_mode = auto
