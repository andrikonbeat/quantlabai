version: '3.8'

# Volume mounts are relative to the repository root by default. Override
# SQX_PATH to run from a different checkout location, e.g.:
#   SQX_PATH=/home/user/quantlab-ai docker compose up

services:
  # ============================================================
  # QuantLab API Service
  # ============================================================
  quantlab-api:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: runtime
    image: quantlab/quantlab:dev
    container_name: quantlab-api
    restart: unless-stopped
    user: "1000:1000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - QUANTLAB_KNOWLEDGE_ROOT=/app/knowledge
      - QUANTLAB_SQX_PATH=/opt/StrategyQuantX
    volumes:
      - ./sdk/quantlab:/app/quantlab:ro
      - ./knowledge:/app/knowledge
      - ./reports:/app/reports
      - ./pipelines:/app/pipelines
      - ./_output:/app/_output
    ports:
      - "8080:8080"
    networks:
      - quantlab-network
    healthcheck:
      test: ["CMD", "python", "-c", "import quantlab; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================================
  # SQX Daemon (StrategyQuant X -gui) — image-only; no Dockerfile.sqx
  # ============================================================
  sqx-daemon:
    image: quantlab/sqx:144.2953
    container_name: sqx-daemon
    restart: unless-stopped
    privileged: true
    ipc: host
    shm_size: 2g
    environment:
      - DISPLAY=:99
      - SQX_PORT=5050
    ports:
      - "5050:5050"
      - "5051:5051"  # WebSocket
    volumes:
      - ${SQX_PATH:-.}/assets/SQX_144_2953_linux_20260601:/opt/StrategyQuantX:ro
      - ./knowledge:/opt/StrategyQuantX/user:rw
    networks:
      - quantlab-network
    deploy:
      resources:
        limits:
          cpus: '3'
          memory: 6G
        reservations:
          cpus: '2'
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================================
  # PostgreSQL (for multi-user/RBAC - future)
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: quantlab-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=quantlab
      - POSTGRES_USER=quantlab
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-quantlab_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ${SQX_PATH:-.}/infra/init-schema.sql:/docker-entrypoint-initdb.d/init-schema.sql:ro
    networks:
      - quantlab-network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantlab -d quantlab"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Redis (caching, sessions, task queue)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: quantlab-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    networks:
      - quantlab-network
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  quantlab-network:
    driver: bridge
    name: quantlab-network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
